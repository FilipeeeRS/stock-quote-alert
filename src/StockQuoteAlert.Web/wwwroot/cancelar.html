<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Cancelar avisos — Alerta de Cotações</title>
  <link rel="stylesheet" href="/estilo.css">
  <style>
    body { align-items: center; padding: 24px; }

    main {
      width: 100%;
      max-width: 440px;
      padding: 34px 30px 30px;
      text-align: center;
    }

    .icone {
      width: 48px; height: 48px;
      margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--vermelho-fraco);
      color: var(--vermelho);
      border: 1px solid rgba(251,113,133,.3);
    }

    .icone.bom {
      background: var(--verde-fraco);
      color: var(--verde);
      border-color: rgba(52,211,153,.3);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem; font-weight: 670; letter-spacing: -0.02em;
    }

    p { margin: 0 0 24px; color: var(--suave); font-size: 0.94rem; line-height: 1.62; }

    #btn-cancelar {
      width: 100%;
      background: linear-gradient(180deg, var(--vermelho-forte) 0%, #9e3348 100%);
      box-shadow: 0 4px 16px rgba(201, 69, 92, .3);
    }

    #btn-cancelar:focus-visible { box-shadow: 0 0 0 3.5px rgba(251,113,133,.4); }

    .voltar {
      display: inline-block; margin-top: 18px;
      color: var(--azul-claro); font-size: 0.9rem;
      text-decoration: none; font-weight: 560;
    }

    .voltar:hover { text-decoration: underline; }
    .voltar:focus-visible { outline: 2px solid var(--azul); outline-offset: 3px; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="cena" aria-hidden="true"></canvas>
  <div id="veu" aria-hidden="true"></div>

  <main class="cartao">
    <div id="confirmacao">
      <div class="icone" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.1" stroke-linecap="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 8-3 8h18s-3-1-3-8"/>
          <path d="M10.3 21a2 2 0 0 0 3.4 0"/>
          <path d="m3 3 18 18"/>
        </svg>
      </div>
      <h1>Cancelar os avisos?</h1>
      <p>Você deixará de receber e-mails sobre esta ação. Pode se inscrever de novo quando quiser.</p>
      <button id="btn-cancelar">Sim, cancelar</button>
    </div>

    <div id="final" class="escondido">
      <div class="icone" id="icone-final" aria-hidden="true"></div>
      <h1 id="titulo-final"></h1>
      <p id="recado" role="status"></p>
      <a class="voltar" href="/">Voltar para a página inicial</a>
    </div>
  </main>

  <script src="/cena.js" defer></script>
  <script>
    // O token vem na URL: /cancelar?token=abc123
    const token = new URLSearchParams(location.search).get('token');

    const confirmacao = document.getElementById('confirmacao');
    const final = document.getElementById('final');
    const botao = document.getElementById('btn-cancelar');

    // Marcação fixa, escrita aqui — nunca montada com dado vindo da API.
    const CERTO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.2 5.2L20 7"/></svg>';
    const ERRADO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6"/><path d="M12 17h.01"/></svg>';

    function mostrarFinal(titulo, texto, bom) {
      const icone = document.getElementById('icone-final');
      icone.innerHTML = bom ? CERTO : ERRADO;
      icone.className = bom ? 'icone bom' : 'icone';

      document.getElementById('titulo-final').textContent = titulo;
      document.getElementById('recado').textContent = texto;

      confirmacao.classList.add('escondido');
      final.classList.remove('escondido');
    }

    if (!token) {
      mostrarFinal('Link incompleto', 'Este endereço não traz o código de cancelamento.', false);
    }

    // O cancelamento só acontece depois do clique, nunca ao abrir a página.
    // Antivírus e servidores de e-mail costumam abrir os links das mensagens
    // sozinhos para checar segurança — se cancelássemos na abertura, pessoas
    // seriam descadastradas sem nunca terem clicado.
    botao.addEventListener('click', async () => {
      botao.disabled = true;
      botao.textContent = 'Cancelando…';

      try {
        const resposta = await fetch('/api/cancelar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const dados = await resposta.json();

        if (resposta.ok) {
          mostrarFinal('Cancelado', dados.mensagem, true);
        } else {
          mostrarFinal('Não deu certo', dados.erro || 'Não foi possível cancelar.', false);
        }
      } catch {
        botao.disabled = false;
        botao.textContent = 'Sim, cancelar';
        mostrarFinal('Falha de conexão', 'Tente novamente em instantes.', false);
      }
    });
  </script>
</body>
</html>
